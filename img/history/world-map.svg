<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="简化世界地图示意图">
  <title>简化世界地图示意图(原创绘制,非精确地图)</title>
  <desc>用于旅行足迹板块的底图,陆地为高度简化的示意轮廓,仅供位置参考。</desc>

  <!-- 纸底 -->
  <rect width="1000" height="500" fill="#f4efe4"/>

  <!-- 经纬网 -->
  <g stroke="#ded5c4" stroke-width="0.7" fill="none">
    <line x1="0" y1="83"  x2="1000" y2="83"/>
    <line x1="0" y1="167" x2="1000" y2="167"/>
    <line x1="0" y1="250" x2="1000" y2="250"/>
    <line x1="0" y1="333" x2="1000" y2="333"/>
    <line x1="0" y1="417" x2="1000" y2="417"/>
    <line x1="167" y1="0" x2="167" y2="500"/>
    <line x1="333" y1="0" x2="333" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="667" y1="0" x2="667" y2="500"/>
    <line x1="833" y1="0" x2="833" y2="500"/>
  </g>

  <!-- 赤道 -->
  <line x1="0" y1="250" x2="1000" y2="250" stroke="#cdbfa6" stroke-width="1.2" stroke-dasharray="7 5"/>

  <!-- 陆地(高度简化) -->
  <g fill="#e0d3ba" stroke="#b9a583" stroke-width="1.3" stroke-linejoin="round">

    <!-- 格陵兰 -->
    <path d="M350,40 L400,35 L420,70 L400,110 L365,105 L340,75 Z"/>

    <!-- 北美洲 -->
    <path d="M33,69 L83,53 L150,44 L236,50 L300,60 L347,111 L320,140 L278,181 L264,222
             L245,205 L208,194 L175,160 L153,139 L140,110 L100,95 L60,85 Z"/>

    <!-- 南美洲 -->
    <path d="M292,222 L333,222 L380,240 L403,264 L395,300 L389,319 L350,360 L320,385
             L306,394 L300,370 L292,361 L278,300 L278,278 L285,245 Z"/>

    <!-- 欧洲 -->
    <path d="M472,131 L480,110 L500,117 L520,100 L542,69 L570,75 L583,83 L570,110
             L569,139 L545,150 L533,133 L510,140 L490,140 Z"/>

    <!-- 非洲 -->
    <path d="M453,161 L528,147 L589,164 L620,190 L642,219 L610,240 L580,250 L570,290
             L556,347 L530,340 L510,300 L490,270 L470,250 L453,208 L445,180 Z"/>

    <!-- 亚洲 -->
    <path d="M583,83 L700,50 L778,42 L860,55 L944,83 L920,120 L880,140 L853,144
             L839,161 L810,180 L778,208 L750,230 L717,228 L700,200 L690,175 L660,170
             L640,180 L625,167 L600,155 L583,139 L570,110 Z"/>

    <!-- 日本列岛 -->
    <path d="M864,128 Q876,136 880,150 Q886,158 892,162 Q880,160 872,150 Q862,140 864,128 Z"/>

    <!-- 不列颠群岛 -->
    <path d="M462,104 Q470,100 472,112 Q468,124 460,122 Q456,112 462,104 Z"/>

    <!-- 澳大利亚 -->
    <path d="M817,311 L870,297 L906,300 L917,330 L917,356 L870,365 L830,356 L819,344 Z"/>

    <!-- 南极洲 -->
    <path d="M0,455 Q250,438 500,455 T1000,455 L1000,500 L0,500 Z"/>
  </g>
</svg>
