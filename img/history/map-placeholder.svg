<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="古地图占位插图">
  <title>古地图占位插图(原创绘制)</title>
  <desc>替换为真实历史地图前的占位图,风格仿旧地图。</desc>

  <rect width="800" height="500" fill="#f0e8d8"/>

  <!-- 经纬网 -->
  <g stroke="#ddd0b6" stroke-width="0.8" fill="none">
    <path d="M0,100 H800 M0,200 H800 M0,300 H800 M0,400 H800"/>
    <path d="M160,0 V500 M320,0 V500 M480,0 V500 M640,0 V500"/>
  </g>

  <!-- 海岸线 -->
  <path d="M0,300 C90,275 130,330 210,305 C280,283 300,340 380,325
           C450,312 470,250 560,262 C640,272 680,220 800,238 L800,500 L0,500 Z"
        fill="#e2d5bb" stroke="#b9a583" stroke-width="1.6"/>

  <!-- 罗盘 -->
  <g transform="translate(650,110)">
    <circle r="52" fill="none" stroke="#b9a583" stroke-width="1.4"/>
    <circle r="40" fill="none" stroke="#cdbfa6" stroke-width="0.9"/>
    <path d="M0,-46 L11,0 L0,46 L-11,0 Z" fill="#9c3d2e" opacity="0.75"/>
    <path d="M-46,0 L0,-11 L46,0 L0,11 Z" fill="#b9a583" opacity="0.6"/>
    <circle r="3.5" fill="#6b5c45"/>
  </g>

  <!-- 花饰 -->
  <g stroke="#b9a583" stroke-width="1.3" fill="none" opacity="0.8">
    <path d="M60,80 q18,-22 36,0 q-18,22 -36,0 Z"/>
    <path d="M110,66 q14,-16 28,0 q-14,16 -28,0 Z"/>
  </g>
</svg>
