  <rect x="38" y="55.5" width="42" height="9" rx="4.5" fill="#a05a2c"/>
  <rect x="38" y="73.5" width="58" height="9" rx="4.5" fill="#7a2e1f"/>
  <line x1="40" y1="27" x2="40" y2="93" stroke="#2b241a" stroke-width="4" stroke-linecap="round"/>
